<!-- This will not display the list of files if the item is withdrawn -->

<ng-container *ngIf="item.allMetadataValues('dc.description.hathi').length > 0 || 
                     item.allMetadataValues('dc.description.fulcrum').length > 0 || 
                     item.allMetadataValues('dc.description.filename').length > 0">
  <h2>Files</h2>
  <ng-container *ngFor="let entry of item.allMetadataValues('dc.description.hathi')">
      <p>
        <span><img title="HathiTrust Viewer" style="height:20px;width:20px;text-decoration:none;" src="../../../../assets/images/file_icons/hathi_trust_icon18x18.png" alt="HathiTrust Viewer">&nbsp;&nbsp;&nbsp;<a href="{{entry}}">View/Open<span style="padding-left:.25em" aria-label="Opens in a new window" class="glyphicon glyphicon-new-window"></span></a></span>
      </p>
  </ng-container>

  <ng-container *ngFor="let entry of item.allMetadataValues('dc.description.fulcrum')">
      <p>
        <span>
           <img title="Fulcrum Viewer" style="height:20px;width:20px;text-decoration:none;" src="../../../../assets/images/file_icons/fulcrum_icon.png" alt="Fulcrum Viewer">&nbsp;&nbsp;&nbsp;<a href="{{entry}}">View/Open<span style="padding-left:.25em" aria-label="Opens in a new window" class="glyphicon glyphicon-new-window"></span></a></span>
      </p>
  </ng-container>

  <ng-container *ngFor="let entry of item.allMetadataValues('dc.description.filename')">
      <p>
        <span>{{entry}}</span>
      </p>
  </ng-container>

</ng-container>


<div *ngIf="!item.isWithdrawn">
  <ng-container *ngVar="(bitstreams$ | async) as bitstreams">
    <ds-metadata-field-wrapper *ngIf="bitstreams?.length > 0" [label]="label | translate">
      <div class="file-section">
        <ds-themed-file-download-link *ngFor="let file of bitstreams; let last=last;" [bitstream]="file" [item]="item">
          <ng-container *ngIf="getIconForRequestCopy(item.firstMetadataValue('dc.requestcopy.email')) != ''">
            <span style="text-decoration:none; width:30px; display: inline-block; margin-right: 10px;" [innerHtml]="getIconForRequestCopy(item.firstMetadataValue('dc.requestcopy.email'))"></span>
          </ng-container>

          <ng-container *ngIf="getIconForFileRestriction(file.firstMetadataValue('dc.description')) != ''">
            <span style="text-decoration:none; width:30px; display: inline-block; margin-right: 10px;" [innerHtml]="getIconForFileRestriction(file.firstMetadataValue('dc.description'))"></span>
          </ng-container>

          <span style="text-decoration:none; width:30px; display: inline-block; margin-right: 10px;" [innerHtml]="dsoNameService.getIconForFile(file)"></span>

          <span>{{ dsoNameService.getName(file) }}</span>
          <span> ({{(file?.sizeBytes) | dsFileSize }})</span>

          <div *ngIf="file?.formatId == this.formatId">
            THIS IS A HIDDEN FILE
          </div>
          <span *ngIf="file.firstMetadataValue('dc.description')!= null">
          {{file.firstMetadataValue('dc.description')}}
          </span>
<!--
          <span class="no-text-decoration ml-1"><i class="fa-solid fa-arrow-up-right-from-square"></i>
          </span>
-->
          <span *ngIf="!last" innerHTML="{{separator}}"></span>

        </ds-themed-file-download-link>

        <ds-themed-loading *ngIf="isLoading" message="{{'loading.default' | translate}}" [showMessage]="false"></ds-themed-loading>
        <div *ngIf="!isLastPage" class="mt-1" id="view-more">
          <button class="bitstream-view-more btn btn-outline-secondary btn-sm" (click)="getNextPage()">{{'item.page.bitstreams.view-more' | translate}}</button>
        </div>
        <div *ngIf="isLastPage && currentPage != 1" class="mt-1" id="collapse">
          <button class="bitstream-collapse btn btn-outline-secondary btn-sm" (click)="currentPage = undefined; getNextPage();">{{'item.page.bitstreams.collapse' | translate}}</button>
        </div>
      </div>
    </ds-metadata-field-wrapper>
  </ng-container>
</div>
