---
name: Build dspace-frontend image

on:
  workflow_dispatch:  # This allows to kick-off the action manually from GitHub Actions

jobs:
  build:
    name: dspace-frontend:${{ github.ref_name }}
    runs-on: ubuntu-latest
    # Ensure this job only executed for 'mlibrary/dspace-angular'
    if: github.repository == 'mlibrary/dspace-angular'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dspace-frontend image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          tags: 'ghcr.io/mlibrary/dspace-angular/dspace-frontend:${{ github.sha }}, ghcr.io/mlibrary/dspace-angular/dspace-frontend:${{ github.ref_name }}'
          file: frontend.dockerfile
